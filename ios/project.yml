# Generate the Xcode project with:  brew install xcodegen && cd ios && xcodegen generate
name: AICab
options:
  bundleIdPrefix: com.aicab
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team ID here (or in Xcode) to run on device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  AICabCore:
    path: Packages/AICabCore

targets:
  AICab:
    type: application
    platform: iOS
    sources:
      - path: AICab
        excludes:
          - "Support/Info.plist"
    dependencies:
      - package: AICabCore
        product: AICabCore
      - package: AICabCore
        product: AICabDesign
      - target: AICabWidgets
        embed: true
        codeSign: true
    info:
      path: AICab/Support/Info.plist
      properties:
        CFBundleDisplayName: AI-Cab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLName: com.aicab.app
            CFBundleURLSchemes: [aicab]
        LSApplicationQueriesSchemes: [instagram-stories, whatsapp]
        NSPhotoLibraryAddUsageDescription: Save word cards to your photo library so you can share them.
        # Static content drops (GitHub Pages / any CDN). Leave empty to use bundled content only.
        AICabContentManifestURL: https://aannuuj.github.io/ai-cab/content/manifest.json
        # Optional: URL of server/define-worker for AI-drafted "Your own words".
        AICabDefineURL: ""
        # Optional: Facebook App ID, required by Instagram Stories sharing.
        AICabFacebookAppID: ""
        AICabAppStoreID: ""
        AICabSupportEmail: hello@aicab.app
        AICabPrivacyURL: https://aannuuj.github.io/ai-cab/privacy.html
        AICabTermsURL: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/
    entitlements:
      path: AICab/Support/AICab.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aicab.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicab.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Paper AppIcon-Night AppIcon-Coral AppIcon-Olive AppIcon-Mono"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  AICabWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AICabWidgets
        excludes:
          - "Info.plist"
    dependencies:
      - package: AICabCore
        product: AICabCore
      - package: AICabCore
        product: AICabDesign
    info:
      path: AICabWidgets/Info.plist
      properties:
        CFBundleDisplayName: AI-Cab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AICabWidgets/AICabWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.aicab.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicab.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  AICab:
    build:
      targets:
        AICab: all
        AICabWidgets: all
    run:
      config: Debug
      storeKitConfiguration: AICab/Resources/AICab.storekit
    test:
      config: Debug
    archive:
      config: Release
