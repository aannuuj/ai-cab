name: iOS

on:
  push:
    paths: ["ios/**", "content/**", "pipeline/**", ".github/workflows/ios.yml"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python pipeline/build_content.py --check

  build:
    name: Test core + build app
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core unit tests
        run: swift test --package-path ios/Packages/AICabCore
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build app + widgets (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project AICab.xcodeproj \
            -scheme AICab \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Capture screenshots
        working-directory: ios
        run: scripts/screenshots.sh build/DerivedData/Build/Products/Debug-iphonesimulator/AICab.app ../screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - name: Commit screenshots to docs/
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          mkdir -p docs/screenshots
          for f in screenshots/*.png; do
            sips --resampleWidth 450 "$f" --out "docs/screenshots/$(basename "$f")" >/dev/null
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update app screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
